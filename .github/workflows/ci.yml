name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, macOS, whisperkey]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift package build & test
        shell: bash
        run: |
          set -euo pipefail
          swift build
          swift test

      - name: Xcode app build
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project WhisperKey.xcodeproj \
            -scheme WhisperKey \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/whisperkey_derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

  auto-merge:
    needs: test
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && !contains(github.event.pull_request.labels.*.name, 'do-not-merge')
      && !contains(github.event.pull_request.labels.*.name, 'wip')
    runs-on: [self-hosted, macOS, whisperkey]
    steps:
      - name: Squash-merge and delete branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch
