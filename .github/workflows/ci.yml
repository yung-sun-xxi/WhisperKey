name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, macOS, whisperkey]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Swift package build & test
        shell: bash
        run: |
          set -euo pipefail
          swift build
          swift test

      - name: Xcode app build
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project WhisperKey.xcodeproj \
            -scheme WhisperKey \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/whisperkey_derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
