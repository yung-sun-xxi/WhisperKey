name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and release (e.g. 1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, macOS, whisperkey]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "Could not resolve version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building WhisperKey $VERSION"

      - name: Unlock keychain (if password provided)
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$KEYCHAIN_PASSWORD" ]; then
            KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -t 3600 "$KEYCHAIN"
            echo "login keychain unlocked"
          else
            echo "No KEYCHAIN_PASSWORD secret set; assuming the login keychain is already unlocked."
          fi

      - name: Build, sign, notarize, package
        env:
          WHISPERKEY_TEAM_ID: ${{ vars.WHISPERKEY_TEAM_ID }}
          WHISPERKEY_NOTARY_PROFILE: WhisperKey-Notary
          WHISPERKEY_SKIP_INSTALL: '1'
        run: ./scripts/release.sh "${{ steps.ver.outputs.version }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v$VERSION"
          DMG="build/WhisperKey-$VERSION.dmg"
          if [ ! -f "$DMG" ]; then
            echo "Expected artifact not found: $DMG" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing the DMG asset."
            gh release upload "$TAG" "$DMG" --clobber
          else
            echo "Creating release $TAG."
            gh release create "$TAG" "$DMG" \
              --title "WhisperKey v$VERSION" \
              --generate-notes
          fi
