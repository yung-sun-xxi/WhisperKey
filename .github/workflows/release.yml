name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and release (e.g. 1.1.0)'
        required: true
        type: string
      release_mode:
        description: 'Distribution mode'
        required: true
        default: 'developer-id'
        type: choice
        options:
          - developer-id
          - ad-hoc

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, macOS, whisperkey]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "Could not resolve version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building WhisperKey $VERSION"

      - name: Resolve release mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.release_mode }}"
          else
            MODE="developer-id"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Using $MODE distribution mode"

      - name: Create signing keychain
        if: steps.mode.outputs.mode == 'developer-id'
        env:
          SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
          WHISPERKEY_TEAM_ID: ${{ vars.WHISPERKEY_TEAM_ID }}
        shell: bash
        run: |
          for v in SIGNING_CERTIFICATE_P12_BASE64 SIGNING_CERTIFICATE_PASSWORD NOTARY_APPLE_ID NOTARY_APP_SPECIFIC_PASSWORD WHISPERKEY_TEAM_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set (see RELEASING.md, Automated Releases)."
              exit 1
            fi
          done

          # The runner is a LaunchAgent in the owner's desktop session, so the
          # user keychain search list is his live one. Remember it verbatim,
          # minus any signing keychain a killed job may have left behind, so
          # the post-step can put it back exactly.
          SAVED_LIST="$RUNNER_TEMP/keychain-search-list.txt"
          security list-keychains -d user \
            | sed 's/^[[:space:]]*"//;s/"[[:space:]]*$//' \
            | grep -v '/whisperkey-sign-' > "$SAVED_LIST" || true
          echo "KEYCHAIN_SEARCH_LIST_FILE=$SAVED_LIST" >> "$GITHUB_ENV"

          # A keychain that exists only for this job, with a password nobody
          # knows. It never lives in ~/Library/Keychains.
          KEYCHAIN="$RUNNER_TEMP/whisperkey-sign-$GITHUB_RUN_ID.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "WHISPERKEY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          P12="$RUNNER_TEMP/signing.p12"
          printf %s "$SIGNING_CERTIFICATE_P12_BASE64" | base64 -d > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign >/dev/null
          rm -f "$P12"
          # Allow codesign to use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # store-credentials validates the profile with Apple. A rejection
          # (currently 403 "A required agreement is missing or has expired")
          # does not stop the release: release.sh then finds no profile and
          # ships the build signed with Developer ID but not notarized.
          if NOTARY_OUTPUT=$(xcrun notarytool store-credentials WhisperKey-Notary \
              --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$WHISPERKEY_TEAM_ID" \
              --password "$NOTARY_APP_SPECIFIC_PASSWORD" \
              --keychain "$KEYCHAIN" 2>&1); then
            echo "Stored the WhisperKey-Notary profile in the job keychain."
          else
            REASON=$(grep -m1 -i 'error' <<<"$NOTARY_OUTPUT" || head -1 <<<"$NOTARY_OUTPUT")
            REASON=${REASON%.}
            REASON=${REASON//'%'/'%25'}
            echo "::warning title=Notarization unavailable::notarytool store-credentials failed: ${REASON:-no output}. The release will be signed with Developer ID but not notarized."
          fi

          # xcodebuild resolves CODE_SIGN_IDENTITY through the search list only
          # (OTHER_CODE_SIGN_FLAGS=--keychain does not help), so the keychain
          # has to be on the list for the duration of the job. The post-step
          # below restores the saved list unconditionally.
          security list-keychains -d user -s "$KEYCHAIN" $(cat "$SAVED_LIST")
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign, package
        env:
          WHISPERKEY_TEAM_ID: ${{ vars.WHISPERKEY_TEAM_ID }}
          WHISPERKEY_NOTARY_PROFILE: WhisperKey-Notary
          WHISPERKEY_SKIP_INSTALL: '1'
          WHISPERKEY_RELEASE_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          ./scripts/release.sh "${{ steps.ver.outputs.version }}"

      - name: Remove signing keychain
        if: always() && steps.mode.outputs.mode == 'developer-id'
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_SEARCH_LIST_FILE:-}" ] && [ -f "$KEYCHAIN_SEARCH_LIST_FILE" ]; then
            security list-keychains -d user -s $(cat "$KEYCHAIN_SEARCH_LIST_FILE")
          fi
          if [ -n "${WHISPERKEY_KEYCHAIN:-}" ] && [ -f "$WHISPERKEY_KEYCHAIN" ]; then
            security delete-keychain "$WHISPERKEY_KEYCHAIN"
          fi
          echo "Search list restored:"
          security list-keychains -d user

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v$VERSION"
          DMG="build/WhisperKey-$VERSION.dmg"
          if [ ! -f "$DMG" ]; then
            echo "Expected artifact not found: $DMG" >&2
            exit 1
          fi
          # release.sh records what the build actually is, so a tag push and a
          # dispatch get the same title for the same outcome.
          NOTARIZATION_FILE="build/notarization.txt"
          if [ ! -f "$NOTARIZATION_FILE" ]; then
            echo "::error::$NOTARIZATION_FILE not found; scripts/release.sh writes it at the end of every build."
            exit 1
          fi
          NOTARIZATION=$(tr -d '[:space:]' < "$NOTARIZATION_FILE")
          case "$NOTARIZATION" in
            notarized)
              TITLE="WhisperKey v$VERSION"
              NOTES=""
              ;;
            not-notarized)
              TITLE="WhisperKey v$VERSION (not notarized)"
              NOTES=$(printf 'Signed with Developer ID, not notarized by Apple.\n\nThe owner installs it with `scripts/install-release.sh %s`. A DMG downloaded in a browser needs **Open Anyway** once, in System Settings → Privacy & Security.' "$VERSION")
              ;;
            ad-hoc)
              TITLE="WhisperKey v$VERSION (temporary ad-hoc build)"
              NOTES=$'⚠️ This temporary build is not notarized by Apple.\n\nAfter installing WhisperKey, open System Settings → Privacy & Security and choose **Open Anyway** once. Future launches work normally.'
              ;;
            *)
              echo "::error::$NOTARIZATION_FILE says '$NOTARIZATION'; expected notarized, not-notarized or ad-hoc."
              exit 1
              ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing the DMG asset."
            gh release upload "$TAG" "$DMG" --clobber
          else
            echo "Creating release $TAG: $TITLE"
            NOTES_ARGS=()
            if [ -n "$NOTES" ]; then
              NOTES_ARGS=(--notes "$NOTES")
            fi
            gh release create "$TAG" "$DMG" \
              --title "$TITLE" \
              ${NOTES_ARGS[@]+"${NOTES_ARGS[@]}"} \
              --generate-notes
          fi
